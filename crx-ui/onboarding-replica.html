<!doctype html>
<html lang="en" class="notranslate" translate="no" notranslate data-no-translate="true">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumno Onboarding — High-Fidelity Replica</title>
<style>
/* =====================================================================
   LUMNO ONBOARDING — HIGH-FIDELITY STANDALONE REPLICA (v2)
   Uses the REAL blueprint (en locale), REAL assets, and the REAL
   animation timings extracted from onboarding.html / onboarding.js.
   Relative asset paths resolve to the project's /assets folder.
   ===================================================================== */

:root{
  --page-bg:#f3f5f7; --page-bg-fill-top:#fbfcfd; --page-bg-fill-bottom:#eef2f5;
  --page-ink:#111827; --page-muted:#6b7280; --page-soft:#eef1f5;
  --surface:#ffffff; --surface-soft:#f8fafc; --surface-border:rgba(17,24,39,.1);
  --accent-blue:#2563eb; --accent-green:#059669; --accent-amber:#d97706; --accent-rose:#e11d48;
  --shadow-shell:0 32px 64px -34px rgba(15,23,42,.22);
  --radius:8px;
  --resize-dur:300ms; --resize-ease:cubic-bezier(.22,1,.36,1);
  --text-swap-dur:200ms; --text-swap-translate-y:8px; --text-swap-blur:2px; --text-swap-ease:ease-out;
  --panel-open-dur:400ms; --panel-close-dur:350ms; --panel-translate-y:100px; --panel-blur:2px;
  --panel-ease:cubic-bezier(.22,1,.36,1);
  --onboarding-frame-scale:1;
  /* cursor continuity (set by JS on forward transitions) */
  --onboarding-cursor-transition-left:58%; --onboarding-cursor-transition-top:43%;
}
@media (prefers-color-scheme:dark){
  :root{
    --page-bg:#111111; --page-ink:#f3f4f6; --page-muted:#9ca3af; --page-soft:#1d1d1d;
    --surface:#191919; --surface-soft:#202020; --surface-border:rgba(255,255,255,.12);
    --shadow-shell:0 34px 68px -34px rgba(0,0,0,.56);
    --page-bg-fill-top:#171717; --page-bg-fill-bottom:#0f0f0f;
  }
}
*{box-sizing:border-box;} html,body{width:100%;height:100%;min-height:100%;}
body{margin:0;background:linear-gradient(180deg,var(--page-bg-fill-top) 0%,var(--page-bg) 48%,var(--page-bg-fill-bottom) 100%);
  color:var(--page-ink);font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
button{font:inherit;} img{display:block;}

/* ---------------- shell / frame ---------------- */
.onboarding-shell{
  position:relative;width:100vw;height:100vh;height:100dvh;margin:0 auto;padding:24px clamp(16px,3.4vw,42px);
  display:grid;place-items:center;overflow:auto;
}
.onboarding-frame{
  position:relative;width:min(1240px,100%);height:min(680px,100%);min-height:min(560px,100%);max-height:680px;
  border-radius:24px;background:var(--surface);box-shadow:var(--shadow-shell);overflow:clip;
  display:grid;grid-template-columns:minmax(340px,1fr) minmax(420px,704px);
  transform:scale(var(--onboarding-frame-scale));transform-origin:center;
}

/* ---------------- copy panel ---------------- */
.copy-panel{
  --px:56px; --py:56px; position:relative;min-width:0;min-height:0;padding:var(--py) var(--px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(22px,4.8vh,32px);background:var(--surface);
}
/* new-tab watermark (visible on intro only) */
.onboarding-newtab-watermark{
  position:absolute;left:var(--px);top:calc(var(--py) - 14px);width:154px;height:34px;pointer-events:none;
  opacity:0;transition:opacity 420ms ease;z-index:0;
}
.onboarding-shell[data-active-slide="intro"] .onboarding-newtab-watermark{opacity:1;}
.onboarding-newtab-watermark__image{width:100%;height:100%;object-fit:contain;opacity:.16;}

.copy-block{min-height:0;display:grid;align-content:start;gap:clamp(20px,4vh,28px);position:relative;z-index:1;}
.onboarding-shell[data-active-slide="intro"] .copy-block{padding-top:18px;}

/* ---------------- page strip ---------------- */
.page-strip{--count:4;width:min(280px,100%);display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:4px;
  align-self:start;margin:0 0 clamp(18px,3.4vh,28px);}
.page-strip[hidden]{display:none;}
.page-strip-segment{all:unset;box-sizing:border-box;display:block;height:5px;border-radius:999px;cursor:pointer;
  background:rgba(17,24,39,.045);transition:background 160ms ease,box-shadow 160ms ease;}
.page-strip-segment[data-active="true"]{background:rgba(17,24,39,.14);}
.page-strip-segment:hover{background:rgba(17,24,39,.085);}
.page-strip[data-entering="true"]{animation:strip-enter 360ms cubic-bezier(.22,1,.36,1) both;}
.page-strip[data-entering="true"] .page-strip-segment{transform-origin:left center;
  animation:strip-seg-enter 520ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(80ms + var(--i,0)*55ms);}
@keyframes strip-enter{from{opacity:0;filter:blur(2px);transform:translateY(-6px);}to{opacity:1;filter:blur(0);transform:translateY(0);}}
@keyframes strip-seg-enter{from{opacity:0;filter:blur(1px);transform:scaleX(.18);}to{opacity:1;filter:blur(0);transform:scaleX(1);}}
@media (prefers-color-scheme:dark){
  .page-strip-segment{background:rgba(255,255,255,.08);}
  .page-strip-segment[data-active="true"]{background:rgba(255,255,255,.22);}
  .page-strip-segment:hover{background:rgba(255,255,255,.14);}
}

/* ---------------- copy typography ---------------- */
.eyebrow,.title,.body-copy{margin:0;}
.eyebrow{min-height:18px;color:var(--accent-green);font-size:13px;font-weight:760;}
.title{--base:36px;max-width:min(560px,100%);min-height:0;font-size:var(--base);line-height:1.24;font-weight:760;letter-spacing:0;}
.title-line{display:inline-block;max-width:100%;white-space:nowrap;}
.title-line--with-logo{display:inline-flex;align-items:center;gap:.16em;white-space:nowrap;}
.title-logo-mark{width:1.08em;height:1.08em;border-radius:.22em;object-fit:contain;
  transform:translateY(var(--title-logo-mark-offset-y,.08em)) rotate(7deg);filter:drop-shadow(0 7px 8px rgba(56,172,248,.38));}
.title-break{display:block;height:0;}
.title-line--rotating{display:inline-flex;align-items:center;flex-wrap:nowrap;gap:0 .16em;white-space:nowrap;}

.title-rotator{--bg:#fef3c7;--ink:#d97706;position:relative;display:inline-flex;align-items:center;justify-content:flex-start;
  width:max-content;min-height:1.14em;padding:.14em .16em .16em;border-radius:8px;background:var(--bg);color:var(--ink);
  line-height:1.08;text-align:left;overflow:hidden;white-space:nowrap;vertical-align:.02em;
  transition:background 200ms ease,color 200ms ease;}
.title-rotator.t-resize{transition:width var(--resize-dur) var(--resize-ease),background 200ms ease,color 200ms ease;}
.title-rotator[data-tone="bookmark"]{--bg:#fef3c7;--ink:#d97706;}
.title-rotator[data-tone="history"]{--bg:#dbeafe;--ink:#2563eb;}
.title-rotator[data-tone="top-sites"]{--bg:#dcfce7;--ink:#059669;}
.title-rotator[data-tone="settings"]{--bg:#fce7f3;--ink:#be185d;}
.title-rotator__text{line-height:inherit;}
.title-rotator__measure{position:absolute;visibility:hidden;white-space:nowrap;pointer-events:none;}
@media (prefers-color-scheme:dark){
  .title-rotator[data-tone="bookmark"]{--bg:rgba(217,119,6,.22);--ink:#fbbf24;}
  .title-rotator[data-tone="history"]{--bg:rgba(37,99,235,.24);--ink:#93c5fd;}
  .title-rotator[data-tone="top-sites"]{--bg:rgba(5,150,105,.24);--ink:#6ee7b7;}
  .title-rotator[data-tone="settings"]{--bg:rgba(190,24,93,.24);--ink:#f9a8d4;}
}

/* ---------------- animation primitives ---------------- */
.t-text-swap{display:inline-block;transform:translateY(0);filter:blur(0);opacity:1;
  transition:transform var(--text-swap-dur) var(--text-swap-ease),filter var(--text-swap-dur) var(--text-swap-ease),opacity var(--text-swap-dur) var(--text-swap-ease);
  will-change:transform,filter,opacity;}
.t-text-swap.is-exit{transform:translateY(calc(var(--text-swap-translate-y)*-1));filter:blur(var(--text-swap-blur));opacity:0;}
.t-text-swap.is-enter-start{transform:translateY(var(--text-swap-translate-y));filter:blur(var(--text-swap-blur));opacity:0;transition:none;}
.t-copy-swap{transform:translateY(0);filter:blur(0);opacity:1;
  transition:transform var(--text-swap-dur) var(--text-swap-ease),filter var(--text-swap-dur) var(--text-swap-ease),opacity var(--text-swap-dur) var(--text-swap-ease);}
.t-copy-swap.is-exit{transform:translateY(calc(var(--text-swap-translate-y)*-1));filter:blur(var(--text-swap-blur));opacity:0;}
.t-copy-swap.is-enter-start{transform:translateY(var(--text-swap-translate-y));filter:blur(var(--text-swap-blur));opacity:0;transition:none;}
.t-panel-slide{transform:translateY(var(--panel-translate-y));opacity:0;filter:blur(var(--panel-blur));pointer-events:none;
  transition:transform var(--panel-close-dur) var(--panel-ease),opacity var(--panel-close-dur) var(--panel-ease),filter var(--panel-close-dur) var(--panel-ease);
  will-change:transform,opacity,filter;}
.t-panel-slide[data-open="true"]{transform:translateY(0);opacity:1;filter:blur(0);pointer-events:auto;
  transition:transform var(--panel-open-dur) var(--panel-ease),opacity var(--panel-open-dur) var(--panel-ease),filter var(--panel-open-dur) var(--panel-ease);}
@media (prefers-reduced-motion:reduce){
  .t-panel-slide,.t-resize,.t-text-swap,.t-copy-swap{transition:none!important;}
  .page-strip[data-entering="true"],.page-strip[data-entering="true"] .page-strip-segment{animation:none;}
}

.body-copy{max-width:min(520px,100%);min-height:0;color:var(--page-muted);font-size:16px;line-height:1.58;overflow-wrap:break-word;}
.body-note{display:block;margin-top:10px;color:color-mix(in srgb,var(--page-muted) 82%,var(--page-ink));font-size:14px;line-height:1.55;}
.body-note:empty{display:none;}
.shortcut-keycap{min-width:24px;height:24px;padding:0 5px;border-radius:8px;border:2px solid #000;
  background:linear-gradient(180deg,#ededed 0%,#fff 100%);box-shadow:0 2px 0 #000;color:#000;font-size:12px;font-weight:700;
  line-height:1;display:inline-flex;align-items:center;justify-content:center;margin:0 2px;}
@media (prefers-color-scheme:dark){.shortcut-keycap{border:2px solid transparent;
  background:linear-gradient(180deg,#5f5f5f,#575757) padding-box,linear-gradient(180deg,#f2f2f2,#d9d9d9) border-box;color:#fff;}}

/* ---------------- action buttons ---------------- */
.onboarding-copy-actions{width:100%;align-self:end;justify-self:start;display:none;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:10px;}
.onboarding-copy-actions[data-visible="true"]{display:inline-flex;}
.onboarding-action-button{all:unset;box-sizing:border-box;position:relative;min-height:40px;padding:0 16px;border-radius:999px;
  border:1px solid var(--bdc,transparent);background:var(--bg,transparent);background-clip:padding-box;color:var(--c,var(--page-ink));
  box-shadow:var(--sh,none);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-size:13px;font-weight:600;line-height:1;white-space:nowrap;
  transition:transform 120ms ease,filter 120ms ease,background 160ms ease,border-color 160ms ease,color 160ms ease,box-shadow 160ms ease;}
.onboarding-action-button::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:var(--before-sh,none);}
.onboarding-action-button:hover{background:var(--hover-bg,var(--bg,transparent));color:var(--hover-c,var(--c,var(--page-ink)));}
.onboarding-action-button[hidden]{display:none;}
.onboarding-action-button:active{transform:translateY(1px) scale(.98);filter:brightness(.95);}
.onboarding-action-button .ri-icon{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-style:normal;}
.onboarding-action-button--primary{--bdc:#040404;--bg:linear-gradient(180deg,#404859 0%,#273042 100%);--c:#fff;
  --sh:0 10px 3px rgba(0,0,0,0),0 6px 2px rgba(0,0,0,.008),0 3px 2px rgba(0,0,0,.035),0 2px 2px rgba(0,0,0,.065),0 0 1px rgba(0,0,0,.075);
  --before-sh:inset 0 1px 1.6px rgba(255,255,255,.34);--hover-bg:linear-gradient(180deg,#4a5467 0%,#2f3a4f 100%);}
.onboarding-action-button--secondary{--bdc:rgba(15,23,42,.06);--bg:#fff;--c:#1f2937;
  --sh:0 2px 2px rgba(15,23,42,.025),0 1px 1px rgba(15,23,42,.035),0 0 1px rgba(15,23,42,.06),inset 0 1px 0 rgba(255,255,255,.75);}
.onboarding-action-button--ghost{margin-left:auto;--bdc:transparent;--bg:transparent;--c:rgba(107,114,128,.86);--sh:none;--hover-bg:rgba(15,23,42,.045);--hover-c:var(--page-ink);}
@media (prefers-color-scheme:dark){
  .onboarding-action-button--primary{--bg:linear-gradient(180deg,#4a566c,#334157);--c:#f8fafc;--hover-bg:linear-gradient(180deg,#56647c,#3a4b66);}
  .onboarding-action-button--secondary{--bdc:rgba(148,163,184,.18);--bg:color-mix(in srgb,var(--surface-soft) 86%,#475569 14%);--c:var(--page-ink);--sh:0 1px 1px rgba(0,0,0,.18);--hover-bg:color-mix(in srgb,var(--surface-soft) 78%,#5b6b84 22%);}
  .onboarding-action-button--ghost{--c:rgba(156,163,175,.88);--hover-bg:rgba(255,255,255,.075);--hover-c:#f3f4f6;}
}

/* ---------------- interaction slots ---------------- */
.interaction-slots{width:max-content;max-width:100%;align-self:end;justify-self:start;display:grid;gap:12px;}
.interaction-slot{all:unset;box-sizing:border-box;min-height:0;padding:0;border:0;border-radius:0;display:grid;
  grid-template-columns:18px minmax(0,1fr);align-items:start;gap:8px;background:transparent;color:var(--page-muted);}
.interaction-row-icon{width:18px;height:18px;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;color:var(--page-muted);font-size:16px;line-height:1;}
.interaction-copy{min-width:0;grid-column:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.interaction-label{color:var(--page-muted);font-size:14px;font-weight:400;line-height:1.58;}
.interaction-slot--with-info .interaction-label{margin-right:2px;}
.interaction-info-button{all:unset;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:999px;color:var(--page-muted);cursor:pointer;font-size:14px;transition:background 160ms ease,color 160ms ease;}
.interaction-info-button:hover{background:rgba(15,23,42,.06);color:var(--page-ink);}
.interaction-link-button{all:unset;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
  border:1px solid var(--surface-border);background:var(--surface-soft);color:var(--page-muted);font-size:12px;font-weight:600;cursor:pointer;
  transition:background 160ms ease,color 160ms ease,border-color 160ms ease;}
.interaction-link-button:hover{background:var(--page-soft);color:var(--page-ink);}
.interaction-link-button .ri-icon{width:14px;height:14px;font-size:14px;font-style:normal;}
/* accordion */
.interaction-slot--accordion{cursor:pointer;}
.interaction-accordion-trigger{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;color:inherit;cursor:pointer;}
.interaction-accordion-trigger:hover{color:var(--page-ink);}
.interaction-accordion-chevron{width:16px;height:16px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  color:currentColor;font-size:16px;line-height:1;transform:rotate(0);transition:transform 180ms ease;}
.interaction-slot--accordion[data-expanded="true"] .interaction-accordion-chevron{transform:rotate(-90deg);}
.interaction-accordion-panel{grid-column:2;display:grid;grid-template-rows:0fr;overflow:hidden;transition:grid-template-rows 220ms ease;}
.interaction-slot--accordion[data-expanded="true"] .interaction-accordion-panel{grid-template-rows:1fr;}
.interaction-accordion-text{min-height:0;max-width:360px;overflow:hidden;color:color-mix(in srgb,var(--page-muted) 86%,var(--page-ink));font-size:13px;line-height:1.58;white-space:pre-line;}
.interaction-accordion-link{color:var(--page-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;}
/* skeleton rows (search / newtab slides) */
.skeleton-line{display:block;height:8px;border-radius:999px;background:var(--page-soft);}
.skeleton-line--label{width:168px;} .skeleton-line--meta{width:96px;margin-top:6px;opacity:.7;}
/* browser avatars */
.browser-avatar-group{display:inline-flex;align-items:center;margin:0 2px;vertical-align:middle;}
.browser-avatar{width:22px;height:22px;flex:0 0 22px;border:1px solid rgba(17,24,39,.1);border-radius:999px;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.08);}
.browser-avatar+.browser-avatar{margin-left:-6px;}
.browser-avatar img{width:100%;height:100%;object-fit:cover;}

/* ---------------- visual stage ---------------- */
.visual-panel-slot{position:relative;min-width:0;min-height:0;width:100%;height:100%;display:grid;align-items:start;justify-items:start;overflow:visible;}
.visual-stage{position:relative;width:100%;height:100%;overflow:visible;}
.visual-stage.is-visual-exit>*{animation:visual-blur-exit 190ms ease-in both;}
@keyframes visual-blur-exit{from{opacity:1;filter:blur(0);}to{opacity:.4;filter:blur(6px);}}
.visual-surface{position:relative;width:100%;height:100%;}

/* demo cursor (real keyframe names + continuity vars) */
.cursor-layer{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.demo-cursor{position:absolute;left:16%;top:33%;width:34px;height:36px;opacity:0;
  transform:rotate(-6deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));}
.demo-cursor svg{width:100%;height:100%;display:block;}
.cursor-layer[data-cursor-mode="intro"] .demo-cursor{animation:onboarding-cursor-logo-wander 8600ms ease-in-out 180ms infinite;}
.cursor-layer[data-cursor-mode="setup"] .demo-cursor{animation:onboarding-cursor-type 2600ms ease-in-out 1640ms both,onboarding-cursor-hover-loop 9600ms linear 4240ms infinite;}
.cursor-layer[data-cursor-mode="search"] .demo-cursor{animation:newtab-triangle-loop 4060ms linear 1500ms infinite;}
.cursor-layer[data-cursor-mode="newtab"] .demo-cursor{animation:site-search-idle 7200ms ease-in-out 120ms infinite;}
.cursor-layer[data-cursor-mode="finish"] .demo-cursor{animation:idle-drift 7200ms ease-in-out 120ms infinite;}
/* forward-transition continuity: hold the captured start position, then run the idle loop */
.cursor-layer[data-cursor-enabled="true"] .demo-cursor{opacity:1;}
.cursor-layer[data-cursor-enabled="false"]{display:none;}
@keyframes onboarding-cursor-logo-wander{
  0%{left:var(--onboarding-cursor-transition-left,58%);top:var(--onboarding-cursor-transition-top,43%);opacity:1;}
  8%{opacity:1;}20%{left:62%;top:36%;}42%{left:56%;top:48%;}64%{left:64%;top:52%;}84%{left:59%;top:40%;}100%{left:var(--onboarding-cursor-transition-left,58%);top:var(--onboarding-cursor-transition-top,43%);opacity:1;}}
@keyframes onboarding-cursor-type{0%{left:var(--onboarding-cursor-transition-left,58%);top:var(--onboarding-cursor-transition-top,43%);}
  45%{left:34%;top:40%;}70%{left:30%;top:39%;}100%{left:31%;top:39%;}}
@keyframes onboarding-cursor-hover-loop{0%{left:31%;top:39%;}25%{left:30%;top:52%;}50%{left:31%;top:64%;}75%{left:31%;top:52%;}100%{left:31%;top:39%;}}
@keyframes newtab-triangle-loop{
  0%{left:var(--onboarding-cursor-transition-left,61%);top:var(--onboarding-cursor-transition-top,40.6%);}
  33%{left:52%;top:56%;}66%{left:70%;top:56%;}100%{left:var(--onboarding-cursor-transition-left,61%);top:var(--onboarding-cursor-transition-top,40.6%);}}
@keyframes site-search-idle{
  0%{left:var(--onboarding-cursor-transition-left,54.8%);top:var(--onboarding-cursor-transition-top,66.5%);}
  30%{left:44%;top:52%;}60%{left:60%;top:44%;}100%{left:var(--onboarding-cursor-transition-left,54.8%);top:var(--onboarding-cursor-transition-top,66.5%);}}
@keyframes idle-drift{
  0%{left:var(--onboarding-cursor-transition-left,76%);top:var(--onboarding-cursor-transition-top,67.5%);}
  35%{left:64%;top:58%;}70%{left:72%;top:46%;}100%{left:var(--onboarding-cursor-transition-left,76%);top:var(--onboarding-cursor-transition-top,67.5%);}}

/* ---------- surface 1: lumno-web-wordmark ---------- */
.lumno-web-wordmark-surface{width:100%;height:100%;display:grid;place-items:center;}
.logo-wordmark-wrap{--wordmark-width:clamp(188px,28vw,260px);position:relative;display:block;width:var(--wordmark-width);
  height:calc(var(--wordmark-width)*47/165);}
.logo-wordmark{width:100%;height:100%;object-fit:contain;}
.logo-butterfly-stage{position:absolute;left:calc(var(--wordmark-width)*152/165);top:6px;
  width:calc(var(--wordmark-width)*20/165);height:calc(var(--wordmark-width)*22/165);
  transform:rotate(-4deg);transform-origin:24% 77%;pointer-events:none;}
.logo-butterfly{position:absolute;inset:0;width:100%;height:100%;}
.logo-butterfly-wing-back{opacity:.22;} .logo-butterfly-wing-front{opacity:.34;}
.logo-butterfly-wing-back{animation:butterfly-flap 2800ms cubic-bezier(.42,0,.58,1) infinite;}
.logo-butterfly-wing-front{animation:butterfly-flap-rot 2800ms cubic-bezier(.42,0,.58,1) infinite;}
@keyframes butterfly-flap{0%,100%{transform:scaleX(1) rotate(-1.5deg);}50%{transform:scaleX(.62) rotate(0deg);}}
@keyframes butterfly-flap-rot{0%,100%{transform:scaleX(1) rotate(-1.5deg);}50%{transform:scaleX(.66) rotate(0deg);}}
.seo-wordmark-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);}

/* ---------- surface 2: bookmark-focus (browser skeleton + overlay demo) ---------- */
.bookmark-focus-ui{position:relative;width:100%;height:100%;}

.ss-tab-hint__key{min-width:24px;height:24px;padding:0 5px;border-radius:8px;border:2px solid #000;
  background:linear-gradient(180deg,#ededed,#fff);box-shadow:0 2px 0 #000;color:#000;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;}
.ss-tab-hint__label{font-size:11px;color:var(--page-muted);white-space:nowrap;}
.ss-divider{height:1px;background:var(--surface-border);margin:0 12px;opacity:0;
  animation:onboarding-overlay-divider-reveal 260ms ease-out calc(var(--case-delay,0ms) + 3520ms) both;}
@keyframes onboarding-overlay-divider-reveal{to{opacity:.55;}}
.ss-result{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  animation:onboarding-overlay-row-enter 500ms cubic-bezier(.22,1,.36,1) calc(var(--case-delay,0ms) + 3620ms) both;}

/* ---------- surface 5: feature-cards ---------- */
.feature-cards-surface{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:0 36px;
  animation:onboarding-newtab-preview-enter 760ms cubic-bezier(.16,1,.3,1) 140ms both;}

  background:
    radial-gradient(120% 90% at 88% 8%, rgba(var(--accent-rgb),.16) 0%, rgba(var(--accent-rgb),0) 60%),
    radial-gradient(90% 70% at 6% 100%, rgba(var(--accent-rgb),.12) 0%, rgba(var(--accent-rgb),0) 62%),
    linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 42%);}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(15,23,42,.05);}

  .onboarding-frame{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;}
  .visual-panel-slot{height:300px;}
}

<body>
<div class="onboarding-shell" id="onboarding-root" data-onboarding-shell data-active-slide="intro" data-active-index="0" data-direction="none" data-cursor-ready="true" data-visual-visible="true">
  <div class="onboarding-frame">
    <section class="copy-panel" id="onboarding-copy-panel">
      <div class="onboarding-newtab-watermark" aria-hidden="true">
        <img class="onboarding-newtab-watermark__image" src="../../assets/images/lumno-wordmark.svg" alt="" />
      </div>
      <div class="copy-block">
        <div class="page-strip" id="onboarding-page-strip" hidden></div>
        <p class="eyebrow" id="onboarding-eyebrow" data-empty="true"></p>
        <h1 class="title" id="onboarding-title"></h1>
        <p class="body-copy" id="onboarding-body"></p>
      </div>
      <div class="interaction-slots" id="onboarding-interaction-slots"></div>
      <div class="onboarding-copy-actions" data-visible="false"></div>
    </section>
    <div class="visual-panel-slot" id="onboarding-visual-slot">
      <div class="visual-stage" id="onboarding-visual-stage"></div>
      <div class="cursor-layer" id="onboarding-cursor-layer" data-cursor-enabled="true" data-cursor-mode="intro">
        <span class="demo-cursor">
          <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M5 3 L5 21 L9.6 17.2 L12.4 23.4 L15.2 22 L12.4 15.9 L18 15.6 Z" fill="#111827" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   LUMNO ONBOARDING REPLICA ENGINE (v2)
   Mirrors onboarding.js: state reducer + render + swap orchestration.
   Blueprint below mirrors onboarding-content.js `getOnboardingBlueprint('en')`.
   ===================================================================== */
(function(){
  const TEXT_SWAP_MS = 200;
  const TITLE_CYCLE_INTERVAL = 1900, TITLE_CYCLE_FIRST_DELAY = 520;
  const LUMNO_WORDMARK = '../../assets/images/lumno-web-textlogo.svg';
  const BROWSERS = [
    {id:'chrome', name:'Chrome', src:'../../assets/images/browser-logos/google-chrome-2022.svg'},
    {id:'edge',   name:'Edge',   src:'../../assets/images/browser-logos/microsoft-edge-2019.svg'},
    {id:'dia',    name:'Dia',    src:'../../assets/images/browser-logos/dia.jpg'},
    {id:'comet',  name:'Comet',  src:'../../assets/images/browser-logos/comet.jpg'}
  ];

  /* ---------------- REAL blueprint (en) ---------------- */
  const BLUEPRINT = { slides: [
    { id:'intro',
      copy:{ eyebrow:'', title:'Search bookmarks instantly', titleLines:['Search bookmarks','instantly'],
             titleLogo:{label:'Lumno', src:'../../assets/images/lumno.png'},
             titleCycle:{ prefix:'Search ', items:[
               {id:'bookmark',  label:'bookmarks',  tone:'bookmark'},
               {id:'history',   label:'history',    tone:'history'},
               {id:'top-sites', label:'top sites',  tone:'top-sites'},
               {id:'settings',  label:'settings',   tone:'settings'}] },
             body:'Open-source command bar + a cleaner new tab' },
      visual:{kind:'lumno-web-wordmark-surface'}, cursor:{enabled:true,mode:'intro'},
      interactions:[
        {kind:'trust-row', icon:'🛡', label:'Open source, private by design',
         linkButton:{icon:'⌥', label:'GitHub repo'}},
        {kind:'browser-row', icon:'◎', avatars:{prefix:'Works in', suffix:'major browsers', browsers:BROWSERS},
         infoTooltip:{icon:'ⓘ', label:'Supported browsers'}},
        {kind:'compatibility-row', icon:'🧩', label:'Friendly with other new-tab extensions',
         infoTooltip:{icon:'ⓘ', label:'Compatibility', text:'Chrome does not let Lumno disable other new-tab extensions. Set Lumno as your new tab to use both.'}}
      ],
      actions:{ primary:{actionId:'next', label:'Get started', icon:'→'} } },

    { id:'setup',
      copy:{ eyebrow:'', title:'A command bar that feels native', titleLines:['A command bar','that feels native'],
             body:'Press {shortcut} to open Lumno anywhere.' },
      visual:{kind:'bookmark-focus-surface'}, cursor:{enabled:true,mode:'setup'},
      interactions:[
        {kind:'accordion-row', icon:'?', label:'Using Dia?',
         accordion:{ id:'dia-browser', text:'If the shortcut does not respond in Dia, change "Open command bar" from "In Dia" to "Global".', link:{label:'Open shortcut settings'} }},
        {kind:'accordion-row', icon:'?', label:'Working with local files?',
         accordion:{ id:'local-file-search', text:'Allow Lumno to access file URLs, then refresh the PDF or HTML tab.', link:{label:'Open extension details'} }}
      ],
      actions:{ primary:{actionId:'next', label:'Next', icon:'→'}, secondary:{actionId:'prev', label:'Back'},
                ghost:{actionId:'openShortcuts', label:'Change shortcut', icon:'↗'} } },

    { id:'search',
      copy:{ eyebrow:'', title:'A calmer new tab for where you go', titleLines:['A calmer new tab','for where you go'],
             body:'Make it yours. Bookmarks and history stay tidy.' },
      visual:{kind:'newtab-preview-surface'}, cursor:{enabled:true,mode:'search'},
      interactions:[ {kind:'segmented-control', skeleton:true}, {kind:'inline-action', skeleton:true} ],
      actions:{ primary:{actionId:'next', label:'Next', icon:'→'} } },

    { id:'newtab',
      copy:{ eyebrow:'', title:'AI / site search in one jump', titleLines:['AI / site search','in one jump'],
             body:'Type, hit Tab, and jump to the right search.' },
      visual:{kind:'site-search-demo-surface'}, cursor:{enabled:true,mode:'newtab'},
      interactions:[ {kind:'choice-list', skeleton:true}, {kind:'inline-action', skeleton:true} ],
      actions:{ primary:{actionId:'next', label:'Next', icon:'→'},
                ghost:{actionId:'openSiteSearchOptions', label:'Supported sites', icon:'↗'} } },

    { id:'finish',
      copy:{ eyebrow:'', title:'Tiny browser wins that add up', titleLines:['Tiny browser wins','that add up'],
             body:'Video popouts, new-tab polish, and useful extras.' },
      visual:{kind:'feature-cards-surface'}, cursor:{enabled:true,mode:'finish'},
      interactions:[],
      actions:{ primary:{actionId:'openNewtab', label:'Start using Lumno', icon:'→'},
                secondary:{actionId:'openChromeWebStore', label:'Rate Lumno'},
                ghost:{actionId:'openOptions', label:'Settings', icon:'↗'} } }
  ]};

  /* ---------------- runtime ---------------- */
  const root = document.getElementById('onboarding-root');
  const pageStrip = document.getElementById('onboarding-page-strip');
  const eyebrowEl = document.getElementById('onboarding-eyebrow');
  const titleEl = document.getElementById('onboarding-title');
  const bodyEl = document.getElementById('onboarding-body');
  const interactionsEl = document.getElementById('onboarding-interaction-slots');
  const actionsEl = document.querySelector('.onboarding-copy-actions');
  const visualStage = document.getElementById('onboarding-visual-stage');
  const cursorLayer = document.getElementById('onboarding-cursor-layer');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let state = { index:0, previousIndex:0, direction:'none', count:BLUEPRINT.slides.length };
  let titleCycleTimer=null, titleCycleFirst=null, titleCycleIndex=0, cycleItems=[], rotatorEl=null, measureEl=null;
  let hoverLoops=[];

  const clamp=(c,i)=>Math.max(0,Math.min(c-1,i));
  function reducer(s,e){
    const c=clamp(s.count,s.index); let n=c;
    if(e.type==='NEXT')n=clamp(s.count,c+1); else if(e.type==='PREV')n=clamp(s.count,c-1);
    else if(e.type==='GOTO')n=clamp(s.count,e.index); else if(e.type==='HOME')n=0; else if(e.type==='END')n=s.count-1;
    return {index:n, previousIndex:c, direction:n>c?'forward':n<c?'back':'none', count:s.count};
  }

  function dispatch(action){
    const next=reducer(state,action);
    if(next.index===state.index && next.direction==='none'){ commit(next); return; }
    if(reduceMotion){ captureCursorTransitionStart(next); commit(next); return; }
    const targets=[titleEl,bodyEl];
    targets.forEach(el=>{ el.classList.add('t-copy-swap'); el.classList.remove('is-enter-start'); el.classList.add('is-exit'); });
    prepareVisualExit(next);
    setTimeout(()=>{
      captureCursorTransitionStart(next);
      commit(next);
      targets.forEach(el=>{ el.classList.add('t-copy-swap','is-enter-start'); el.classList.remove('is-exit'); });
      targets.forEach(el=>void el.offsetHeight);
      targets.forEach(el=>el.classList.remove('is-enter-start'));
    }, TEXT_SWAP_MS);
  }

  /* cursor continuity: capture live cursor pos as CSS vars for forward transitions */
  function captureCursorTransitionStart(next){
    const cur=BLUEPRINT.slides[state.index], nxt=BLUEPRINT.slides[next.index];
    const forwardPairs=[['intro','setup'],['setup','search'],['search','newtab'],['newtab','finish']];
    const isForward = forwardPairs.some(([a,b])=>cur.id===a && nxt.id===b);
    if(!isForward || reduceMotion){ clearCursorTransitionStart(); return; }
    const cursor=cursorLayer.querySelector('.demo-cursor');
    if(!cursor){ clearCursorTransitionStart(); return; }
    const cs=getComputedStyle(cursor);
    const w=cursorLayer.clientWidth||1, h=cursorLayer.clientHeight||1;
    const pct=(px,total)=>Math.max(0,Math.min(100, (parseFloat(px)||0)/total*100));
    root.style.setProperty('--onboarding-cursor-transition-left', pct(cs.left,w).toFixed(2)+'%');
    root.style.setProperty('--onboarding-cursor-transition-top',  pct(cs.top,h).toFixed(2)+'%');
    if(cs.transform && cs.transform!=='none') root.style.setProperty('--onboarding-cursor-transition-transform', cs.transform);
  }
  function clearCursorTransitionStart(){
    root.style.removeProperty('--onboarding-cursor-transition-left');
    root.style.removeProperty('--onboarding-cursor-transition-top');
    root.style.removeProperty('--onboarding-cursor-transition-transform');
  }

  function prepareVisualExit(next){
    const cur=BLUEPRINT.slides[state.index], nxt=BLUEPRINT.slides[next.index];
    if(cur.visual.kind==='bookmark-focus-surface' && nxt.visual.kind==='lumno-web-wordmark-surface' && !reduceMotion){
      visualStage.classList.add('is-visual-exit'); cursorLayer.classList.add('is-visual-exit');
      setTimeout(()=>{ visualStage.classList.remove('is-visual-exit'); cursorLayer.classList.remove('is-visual-exit'); },220);
    }
  }

  function commit(next){
    state=next;
    const slide=BLUEPRINT.slides[state.index];
    root.dataset.activeSlide=slide.id;
    root.dataset.activeIndex=String(state.index);
    root.dataset.direction=state.direction;
    cursorLayer.dataset.cursorEnabled = slide.cursor.enabled?'true':'false';
    cursorLayer.dataset.cursorMode = slide.cursor.mode||'';
    renderCopy(slide); renderInteractions(slide); renderActions(slide); renderPageStrip(); renderVisual(slide);
  }

  /* ---------------- copy ---------------- */
  function renderCopy(slide){
    stopTitleCycle();
    const c=slide.copy;
    eyebrowEl.textContent=c.eyebrow||''; eyebrowEl.dataset.empty = c.eyebrow?'false':'true';
    titleEl.innerHTML=''; titleEl.classList.remove('t-copy-swap','is-exit','is-enter-start');
    if(c.titleCycle) renderTitleCycle(c);
    else renderTitleLines(c);
    renderBody(c);
  }
  function renderTitleLines(c){
    const lines=c.titleLines||[c.title];
    lines.forEach((text,i)=>{
      if(i>0){ const br=document.createElement('span'); br.className='title-break'; titleEl.appendChild(br); }
      const isLast = i===lines.length-1;
      const span=document.createElement('span');
      span.className = (isLast && c.titleLogo) ? 'title-line title-line--with-logo' : 'title-line';
      span.appendChild(document.createTextNode(text));
      if(isLast && c.titleLogo){
        const img=document.createElement('img');
        img.className='title-logo-mark'; img.src=c.titleLogo.src; img.alt=''; img.title=c.titleLogo.label;
        span.appendChild(img);
      }
      titleEl.appendChild(span);
    });
  }
  function renderTitleCycle(c){
    const cycle=c.titleCycle;
    const lines=c.titleLines||[];
    if(lines[0]) { const l1=document.createElement('span'); l1.className='title-line'; l1.textContent=lines[0]; titleEl.appendChild(l1);
                   const br=document.createElement('span'); br.className='title-break'; titleEl.appendChild(br); }
    const rotating=document.createElement('span'); rotating.className='title-line--rotating';
    const prefixNode=document.createElement('span'); prefixNode.textContent=cycle.prefix.replace(/\s$/,'');
    const r=document.createElement('span'); r.className='title-rotator t-resize'; r.dataset.tone=cycle.items[0].tone;
    const t=document.createElement('span'); t.className='title-rotator__text t-text-swap'; t.textContent=cycle.items[0].label;
    const m=document.createElement('span'); m.className='title-rotator__measure'; m.setAttribute('data-title-rotator-measure','');
    m.textContent=cycle.items[0].label;
    r.appendChild(t); r.appendChild(m);
    rotating.appendChild(prefixNode); rotating.appendChild(document.createTextNode(' ')); rotating.appendChild(r);
    if(c.titleLogo){ const img=document.createElement('img'); img.className='title-logo-mark'; img.src=c.titleLogo.src; img.alt=''; rotating.appendChild(img); }
    titleEl.appendChild(rotating);
    rotatorEl=r; measureEl=m; cycleItems=cycle.items; titleCycleIndex=0;
    setTitleCycleWidth(cycle.items[0].label);
    if(!reduceMotion){
      titleCycleFirst=setTimeout(()=>{ advanceTitleCycle(); titleCycleTimer=setInterval(advanceTitleCycle,TITLE_CYCLE_INTERVAL); },TITLE_CYCLE_FIRST_DELAY);
    }
  }
  function measureWidth(label){
    measureEl.textContent=label;
    const s=getComputedStyle(rotatorEl);
    const pad=parseFloat(s.paddingLeft)+parseFloat(s.paddingRight);
    return Math.ceil(measureEl.getBoundingClientRect().width+pad);
  }
  function setTitleCycleWidth(label){ const w=measureWidth(label); if(w>0) rotatorEl.style.width=w+'px'; }
  function advanceTitleCycle(){
    titleCycleIndex=(titleCycleIndex+1)%cycleItems.length;
    const item=cycleItems[titleCycleIndex];
    const tEl=rotatorEl.querySelector('.title-rotator__text');
    if(reduceMotion){ rotatorEl.dataset.tone=item.tone; tEl.textContent=item.label; setTitleCycleWidth(item.label); return; }
    tEl.classList.add('is-exit');
    setTimeout(()=>{
      rotatorEl.dataset.tone=item.tone; tEl.textContent=item.label; tEl.classList.remove('is-exit');
      tEl.classList.add('is-enter-start'); setTitleCycleWidth(item.label);
      void tEl.offsetHeight; tEl.classList.remove('is-enter-start');
    },TEXT_SWAP_MS);
  }
  function stopTitleCycle(){ if(titleCycleTimer)clearInterval(titleCycleTimer); if(titleCycleFirst)clearTimeout(titleCycleFirst); titleCycleTimer=null; titleCycleFirst=null; }

  function renderBody(c){
    bodyEl.innerHTML=''; bodyEl.classList.remove('t-copy-swap','is-exit','is-enter-start');
    const raw=c.body||'';
    if(!raw.includes('{shortcut}')){ bodyEl.textContent=raw; return; }
    const [pre,suf]=raw.split('{shortcut}');
    bodyEl.appendChild(document.createTextNode(pre));
    ['⌘','K'].forEach(k=>{ const s=document.createElement('span'); s.className='shortcut-keycap'; s.textContent=k; bodyEl.appendChild(s); });
    bodyEl.appendChild(document.createTextNode(suf||''));
  }

  /* ---------------- interactions ---------------- */
  function renderInteractions(slide){
    interactionsEl.innerHTML='';
    interactionsEl.dataset.accordion = (slide.interactions||[]).some(i=>i.kind==='accordion-row') ? 'true':'false';
    (slide.interactions||[]).forEach((it,idx)=>{
      const slot=document.createElement('div'); slot.className='interaction-slot';
      const icon=document.createElement('span'); icon.className='interaction-row-icon'; icon.textContent=it.icon||'•';
      const copy=document.createElement('div'); copy.className='interaction-copy';

      if(it.kind==='accordion-row'){
        slot.classList.add('interaction-slot--accordion'); slot.dataset.accordionId=it.accordion.id; slot.dataset.expanded='false';
        const trig=document.createElement('button'); trig.className='interaction-accordion-trigger'; trig.setAttribute('aria-expanded','false');
        const lbl=document.createElement('span'); lbl.className='interaction-label'; lbl.textContent=it.label;
        const chev=document.createElement('span'); chev.className='interaction-accordion-chevron'; chev.textContent='⌄';
        trig.appendChild(lbl); trig.appendChild(chev); copy.appendChild(trig);
        const panel=document.createElement('div'); panel.className='interaction-accordion-panel';
        const txt=document.createElement('div'); txt.className='interaction-accordion-text t-panel-slide'; txt.dataset.open='false';
        txt.appendChild(document.createTextNode(it.accordion.text+' '));
        const a=document.createElement('a'); a.className='interaction-accordion-link'; a.href='#'; a.textContent=it.accordion.link.label;
        txt.appendChild(a); panel.appendChild(txt);
        slot.appendChild(icon); slot.appendChild(copy); slot.appendChild(panel);
        trig.addEventListener('click',()=>{
          const open=slot.dataset.expanded!=='true';
          slot.dataset.expanded=open?'true':'false'; trig.setAttribute('aria-expanded',String(open));
          panel.dataset.open=open?'true':'false'; txt.dataset.open=open?'true':'false';
        });
      } else if(it.skeleton){
        slot.classList.add('interaction-slot--static');
        const wrap=document.createElement('div'); wrap.className='interaction-copy';
        wrap.style.display='grid';
        const l=document.createElement('span'); l.className='skeleton-line skeleton-line--label';
        const m=document.createElement('span'); m.className='skeleton-line skeleton-line--meta';
        wrap.appendChild(l); wrap.appendChild(m);
        slot.appendChild(icon); slot.appendChild(wrap);
      } else {
        const lbl=document.createElement('span'); lbl.className='interaction-label'; lbl.textContent=it.label||'';
        copy.appendChild(lbl);
        if(it.avatars){
          const a=it.avatars;
          const pre=document.createElement('span'); pre.className='interaction-label'; pre.textContent=a.prefix+' ';
          copy.insertBefore(pre,lbl); lbl.textContent=' '+a.suffix;
          const group=document.createElement('span'); group.className='browser-avatar-group';
          a.browsers.forEach(b=>{ const av=document.createElement('span'); av.className='browser-avatar'; av.title=b.name;
            const img=document.createElement('img'); img.src=b.src; img.alt=b.name; av.appendChild(img); group.appendChild(av); });
          copy.insertBefore(group,lbl);
        }
        if(it.infoTooltip){
          slot.classList.add('interaction-slot--with-info');
          const btn=document.createElement('button'); btn.className='interaction-info-button'; btn.textContent=it.infoTooltip.icon||'ⓘ';
          btn.setAttribute('data-tooltip', it.infoTooltip.text || it.infoTooltip.label);
          copy.appendChild(btn); attachTip(btn);
        }
        if(it.linkButton){
          const lb=document.createElement('button'); lb.className='interaction-link-button';
          lb.innerHTML='<span class="ri-icon">'+it.linkButton.icon+'</span><span>'+it.linkButton.label+'</span>';
          lb.addEventListener('click',()=>window.open('https://github.com/kubai087/lumno-extension','_blank'));
          copy.appendChild(lb);
        }
        slot.appendChild(icon); slot.appendChild(copy);
      }
      interactionsEl.appendChild(slot);
    });
  }

  /* minimal tooltip (mirrors shared/tooltip.js behavior) */
  let tipEl=null;
  function attachTip(btn){
    const show=()=>{
      if(!tipEl){ tipEl=document.createElement('div'); tipEl.style.cssText='position:fixed;z-index:10000;max-width:260px;padding:8px 12px;border-radius:10px;background:linear-gradient(180deg,#fff,#f7f9fc);color:#556070;border:1px solid rgba(214,219,227,.95);box-shadow:0 16px 36px rgba(17,24,39,.08),0 3px 10px rgba(17,24,39,.05);font-size:12px;font-weight:500;line-height:1.35;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 120ms ease,transform 120ms ease;';
        document.body.appendChild(tipEl); }
      tipEl.textContent=btn.getAttribute('data-tooltip')||'';
      const r=btn.getBoundingClientRect();
      tipEl.style.left=Math.max(8,Math.min(window.innerWidth-268, r.left))+'px';
      tipEl.style.top=(r.top-tipEl.offsetHeight-10)+'px';
      requestAnimationFrame(()=>{ tipEl.style.opacity='1'; tipEl.style.transform='translateY(0)'; });
    };
    const hide=()=>{ if(tipEl){ tipEl.style.opacity='0'; tipEl.style.transform='translateY(4px)'; } };
    btn.addEventListener('mouseenter',show); btn.addEventListener('mouseleave',hide);
    btn.addEventListener('focus',show); btn.addEventListener('blur',hide);
  }

  /* ---------------- actions ---------------- */
  function renderActions(slide){
    actionsEl.innerHTML='';
    const defs=[['primary','onboarding-action-button--primary'],['secondary','onboarding-action-button--secondary'],['ghost','onboarding-action-button--ghost']];
    let any=false;
    defs.forEach(([k,cls])=>{
      const a=slide.actions&&slide.actions[k]; if(!a) return;
      any=true;
      const b=document.createElement('button'); b.className='onboarding-action-button '+cls; b.dataset.action=a.actionId;
      b.innerHTML='<span>'+a.label+'</span>'+(a.icon?'<i class="ri-icon">'+a.icon+'</i>':'');
      b.addEventListener('click',()=>onAction(a.actionId));
      actionsEl.appendChild(b);
    });
    actionsEl.dataset.visible=any?'true':'false';
  }
  function onAction(id){
    if(id==='next') dispatch({type:'NEXT'});
    else if(id==='prev') dispatch({type:'PREV'});
    else if(id==='openNewtab') dispatch({type:'END'});
  }

  /* ---------------- page strip ---------------- */
  function renderPageStrip(){
    const total=state.count, cur=state.index;
    const wasHidden = pageStrip.hidden;
    pageStrip.hidden = cur<=0;
    pageStrip.dataset.entering = (wasHidden && !pageStrip.hidden) ? 'true':'false';
    pageStrip.style.setProperty('--count', String(total-1));
    pageStrip.innerHTML='';
    for(let p=0;p<total-1;p++){
      const seg=document.createElement('button'); seg.className='page-strip-segment';
      seg.dataset.active=(p===cur-1)?'true':'false';
      seg.style.setProperty('--i',String(p)); seg.dataset.slideTarget=String(p+1);
      seg.addEventListener('click',()=>dispatch({type:'GOTO',index:p+1}));
      pageStrip.appendChild(seg);
    }
  }

  /* ---------------- visual surfaces ---------------- */
  function clearHoverLoops(){ hoverLoops.forEach(t=>clearTimeout(t)); hoverLoops.forEach(i=>i&&clearInterval(i)); hoverLoops=[]; }
  function renderVisual(slide){
    clearHoverLoops();
    visualStage.className='visual-stage';
    visualStage.dataset.visualKind=slide.visual.kind;
    visualStage.innerHTML='';
    const s=document.createElement('div'); s.className='visual-surface '+slide.visual.kind;
    if(slide.visual.kind==='lumno-web-wordmark-surface') buildWordmark(s);
    else if(slide.visual.kind==='bookmark-focus-surface') buildBookmarkFocus(s);
    else if(slide.visual.kind==='newtab-preview-surface') buildNewtabPreview(s);
    else if(slide.visual.kind==='site-search-demo-surface') buildSiteSearch(s);
    else if(slide.visual.kind==='feature-cards-surface') buildFeatureCards(s);
    visualStage.appendChild(s);
  }

          '<div class="feature-award__label"><span>'+a[0]+'</span><span>'+a[1]+'</span></div>'+
          '<span class="feature-award__wheat feature-award__wheat--right"></span></section>').join('')+
      '</div>'+
      '<div class="feature-cards-surface__stack">'+
        cards.map((c,i)=>'<article class="feature-card" data-tone="'+c.tone+'" style="--feature-card-delay:'+(260+i*90)+'ms">'+
          '<header class="feature-card__copy"><h2 class="feature-card__title">'+c.title+'</h2>'+
          '<p class="feature-card__body">'+c.body+'</p></header>'+
          '<div class="feature-card__art feature-card__art--'+c.tone+'"><img class="feature-card__art-image" src="'+c.art+'" alt=""/></div>'+
        '</article>').join('')+
      '</div>';
  }

  /* ---------------- keyboard ---------------- */
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') dispatch({type:'NEXT'});
    else if(e.key==='ArrowLeft') dispatch({type:'PREV'});
    else if(e.key==='Home') dispatch({type:'HOME'});
    else if(e.key==='End') dispatch({type:'END'});
  });

  commit(state);
})();
</script>
</body>
</html>
